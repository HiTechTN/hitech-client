<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiTech Client — Framework Universel</title>
<link rel="stylesheet" href="/hc-static/style.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
<body>
<!-- Login (email+PIN; bundled apps & admin token fallback) -->
<div id="loginOverlay" class="modal hidden">
  <div class="modal-box small">
    <div class="modal-head"><span>🔐 HiTech Client</span></div>
    <div class="modal-body">
      <div id="loginStep1">
        <p class="muted" data-i18n="login_msg">Entre ton email — on t'envoie un code.</p>
        <input type="email" id="loginEmail" placeholder="toi@exemple.tn" style="width:100%;box-sizing:border-box;padding:.6rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:#fff;margin-bottom:.8rem;">
        <button class="btn primary wide" onclick="requestCode()">✉️ Recevoir le code</button>
      </div>
      <div id="loginStep2" class="hidden">
        <p class="muted">Code envoyé à <b id="loginEmailShow"></b></p>
        <input type="text" id="loginPin" maxlength="6" inputmode="numeric" placeholder="••••••" style="width:100%;box-sizing:border-box;padding:.6rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:#fff;margin-bottom:.8rem;text-align:center;letter-spacing:.5em;font-size:1.2rem;">
        <button class="btn primary wide" onclick="verifyCode()">Vérifier</button>
        <button class="btn ghost wide" onclick="loginBack()" style="margin-top:.4rem;">← Retour</button>
      </div>
      <div id="loginTokenRow" style="margin-top:1rem;border-top:1px solid var(--line);padding-top:.8rem;">
        <details><summary class="muted" style="cursor:pointer;font-size:.78rem;">Accès admin par token</summary>
          <input type="password" id="loginToken" placeholder="token" style="width:100%;box-sizing:border-box;padding:.6rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:#fff;margin:.5rem 0;">
          <button class="btn wide" onclick="bundleLogin()">Entrer (token)</button>
        </details>
      </div>
      <p id="loginErr" class="muted"></p>
    </div>
  </div>
</div>
<aside id="side">
  <div class="side-head"><span class="logo">H</span><div><b>HiTech Client</b><small data-i18n="sub">framework universel</small></div></div>
  <button class="btn primary wide" onclick="newSession()" data-i18n="newchat">＋ Nouvelle conversation</button>
  <div id="sessions"></div>
  <div class="side-foot muted">
    <div id="userBox" class="hidden"><span id="userEmail"></span> <button class="btn ghost sm" onclick="userLogout()" title="Déconnexion">⎋</button></div>
    <div>backend: <span id="connDot">…</span></div>
  </div>
</aside>
<main id="main">
  <header id="chatHead">
    <div id="backendSeg" class="seg"></div>
    <select id="backendSel" class="hidden"></select>
    <div class="mwrap">
      <button id="modelBtn" class="mbtn" onclick="toggleModelPicker(event)" title="Modèle"></button>
      <div id="modelPicker" class="mpicker hidden">
        <input id="mpSearch" data-i18n-ph="mp_search" placeholder="Chercher un modèle…">
        <div id="mpList"></div>
      </div>
    </div>
    <select id="modelSel" class="hidden"></select>
    <span id="caps" class="muted"></span>
    <span class="spacer"></span>
    <button class="btn sm" onclick="toggleLang()" title="Français / Derja">🇹🇳</button>
    <button class="btn sm" onclick="exportToDrive()" title="Exporter vers HiTech Drive">💾</button>
  </header>
  <div id="msgs"></div>
  <div id="pending" class="muted hidden"></div>
  <div id="composer">
    <button class="btn" id="driveBtn" onclick="openDrive()" title="Joindre depuis HiTech Drive">📁</button>
    <button class="btn" id="vidBtn" onclick="attachVideo()" title="Joindre une vidéo (frames)">🎥</button>
    <button class="btn" id="micBtn" onclick="dictate()" title="Dicter (voix → texte)">🎤</button>
    <input type="file" id="vidFile" accept="video/*" class="hidden">
    <textarea id="input" rows="2" data-i18n-ph="ph" placeholder="Écris ou dicte ton message… (Entrée = envoyer)"></textarea>
    <button class="btn" id="ttsBtn" onclick="toggleTTS()" title="Lire les réponses à voix haute">🔊</button>
    <button class="btn primary" onclick="send()">➤</button>
  </div>
  <audio id="ttsAudio" class="hidden"></audio>
  <div id="toast" class="toast hidden"></div>
</main>
<!-- Drive picker modal -->
<div id="driveModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><span data-i18n="drive_title">📁 HiTech Drive</span><button class="btn ghost" onclick="closeDrive()">✕</button></div>
    <div class="modal-body">
      <div id="driveCrumbs" class="crumbs"></div>
      <div id="driveList"></div>
      <p id="driveMsg" class="muted"></p>
    </div>
  </div>
</div>
<script src="/hc-static/app.js?v=4"></script>
</body>
</html>
