name: Release HCF

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    name: 🌐 Web (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack web UI
        run: |
          cd apps/web
          zip -r "../../hitech-client-web-${{ github.ref_name }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: hitech-client-web-*.zip

  android:
    name: 🤖 Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      - name: Install Android SDK
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          sudo unzip -q /tmp/clt.zip -d /usr/local/lib/android/sdk/cmdline-tools
          sudo mv /usr/local/lib/android/sdk/cmdline-tools/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build web + sync + APK
        working-directory: apps/mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          npm ci
          npm run build:web
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/hitech-client-mobile-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  tauri-linux:
    name: 🐧 Desktop Linux (deb/AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev
      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HiTech Client ${{ github.ref_name }} 🇹🇳"
          releaseBody: "Sa7bek AI el kol fi blast wa7da — web, desktop, mobile. Chouf el README lel installation."
          releaseDraft: false
          prerelease: false
          projectPath: apps/desktop
          args: --config src-tauri/tauri.conf.json --bundles deb,appimage

  tauri-windows:
    name: 🪟 Desktop Windows (msi/nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HiTech Client ${{ github.ref_name }} 🇹🇳"
          releaseDraft: false
          prerelease: false
          projectPath: apps/desktop
          args: --config src-tauri/tauri.conf.json

  tauri-macos:
    name: 🍎 Desktop macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HiTech Client ${{ github.ref_name }} 🇹🇳"
          releaseDraft: false
          prerelease: false
          projectPath: apps/desktop
          args: --config src-tauri/tauri.conf.json --bundles dmg
